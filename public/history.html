<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeterLab – History</title>
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark meterlab-navbar" aria-label="Primary">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="./mixer.html">
        <img src="./assets/meterlab-logo.svg" alt="MeterLab" width="28" height="28" decoding="async">
        <span>MeterLab</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meterlabNav" aria-controls="meterlabNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="meterlabNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="./mixer.html">Mixer</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="./glossary.html">Glossary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./history.html">History</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="analysis-panel">
      <div class="d-flex justify-content-between align-items-start gap-3" style="margin-bottom: 10px;">
        <div>
          <h3 style="margin: 0;">Score History</h3>
          <p style="margin: 8px 0 0 0; color: rgba(255,255,255,0.75); max-width: 70ch;">
            Saved snapshots of Song Score for a track vs a reference and/or genre. Use this to review decisions later.
          </p>
        </div>
        <div class="d-flex align-items-end gap-2">
          <div>
            <label for="historySearch" class="score-panel-label">Search</label>
            <input id="historySearch" class="form-control form-control-sm meterlab-select" placeholder="Track name, genre, reference…" />
          </div>
          <button id="clearHistoryBtn" class="btn btn-sm btn-outline-light" type="button">Clear</button>
        </div>
      </div>

      <div id="historyEmpty" class="playlist-empty" style="display:none;">No saved score snapshots yet. Go to Mixer → Song Score → Save snapshot.</div>

      <div class="table-responsive">
        <table class="table table-dark table-striped align-middle" style="margin: 0;">
          <thead>
            <tr>
              <th style="min-width: 240px;">Track</th>
              <th style="min-width: 220px;">Context</th>
              <th style="min-width: 140px;">Score</th>
              <th style="min-width: 170px;">Saved</th>
              <th style="min-width: 110px;"></th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/history.js"></script>
</body>
</html>
