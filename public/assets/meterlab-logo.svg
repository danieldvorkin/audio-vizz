<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="MeterLab logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#4caf50"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="18" y="18" width="220" height="220" rx="44" fill="url(#bg)" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>

  <!-- Meter window -->
  <rect x="62" y="54" width="132" height="148" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" stroke-width="3"/>

  <!-- Bars (left to right) -->
  <rect x="82" y="132" width="18" height="50" rx="9" fill="#4caf50"/>
  <rect x="110" y="96" width="18" height="86" rx="9" fill="#4caf50"/>
  <rect x="138" y="72" width="18" height="110" rx="9" fill="url(#accent)"/>
  <rect x="166" y="112" width="18" height="70" rx="9" fill="#4a9eff"/>

  <!-- Baseline -->
  <rect x="78" y="188" width="100" height="4" rx="2" fill="rgba(255,255,255,0.20)"/>

  <!-- Small dot to evoke “lab”/measurement -->
  <circle cx="186" cy="198" r="6" fill="rgba(255,255,255,0.24)"/>
</svg>
